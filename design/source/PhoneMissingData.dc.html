</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F6F4EE; color: #1B2620; font-family: 'Public Sans', 'Segoe UI', system-ui, sans-serif">

      <div style="padding: 10px; border-radius: 8px; background: #F0EDE5; border: 1px dashed #C9C4B6; display: flex; flex-direction: column; gap: 2px">

        <dd style="margin: 0; font-size: 14px; font-weight: 500; font-style: italic; color: #3F4A44">Not yet rated</dd>

    <section style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700">Amenities</h2>
