<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Find a Park – phone list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5B3F}a:hover{color:#123826}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F6F4EE; color: #1B2620; font-family: 'Public Sans', 'Segoe UI', system-ui, sans-serif">
  <header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #1E5B3F; color: #FFFFFF">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-6"></path><path d="M12 16 6 16 12 3 18 16Z"></path></svg>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 18px; font-weight: 800">Find a Park</span>
      <span style="font-size: 13px; color: #D7E8DD">12 parks · New York City area</span>
    </div>
  </header>

  <div role="group" aria-label="View" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 12px 16px; padding: 4px; border-radius: 10px; background: #E6E2D8">
    <button type="button" aria-pressed="true" style="min-height: 44px; border: 0; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; color: #1B2620; box-shadow: 0 1px 2px rgba(0,0,0,0.12)">List</button>
    <button type="button" aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #3F4A44">Map</button>
  </div>

  <ul style="margin: 0; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{parks}}" as="p" hint-placeholder-count="6">
      <li style="list-style: none">
        <button type="button" style="width: 100%; box-sizing: border-box; text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: #FFFFFF; border: 1px solid #DAD6CB; border-radius: 10px; font: inherit; color: inherit">
          <span aria-hidden="true" style="flex: none; width: 30px; height: 30px; border-radius: 50%; background: #1E5B3F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{p.num}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-size: 17px; font-weight: 700">{{p.name}}</span>
            <span style="font-size: 15px; color: #4F5B54">{{p.addressText}}</span>
            <span style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px">
              <sc-for list="{{p.chips}}" as="c" hint-placeholder-count="3">
                <span style="font-size: 13px; padding: 3px 8px; border-radius: 999px; background: #E9EFE7; color: #23472F">{{c}}</span>
              </sc-for>
            </span>
          </span>
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F5B54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; align-self: center"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const PARKS = [
  {name:'Cedar Hill Nature Preserve',address:'Cedar Hill Rd',amenities:['trails','wildlife-viewing','parking']},
  {name:'Central Plaza Green',address:'1 Plaza Way',amenities:['event-lawn','wifi','restrooms','food-vendors','accessible-paths']},
  {name:'East Ridge Trailhead',address:'Ridge Rd',amenities:['trails','parking','wildlife-viewing']},
  {name:'Highland Dog Park',address:null,amenities:['dog-run','restrooms','parking','water-fountain']},
  {name:'Hillcrest Skate Park',address:'Hillcrest Ave',amenities:['skate-park','restrooms','lighting']},
  {name:'Lakeshore Point',address:'Shore Pkwy',amenities:['waterfront','fishing','kayak-launch','picnic-areas','parking']}
];
const label = (a) => a.charAt(0).toUpperCase() + a.slice(1).replace(/-/g, ' ');
class Component extends DCLogic {
  renderVals() {
    return {
      parks: PARKS.map((p, i) => {
        const chips = p.amenities.slice(0, 3).map(label);
        if (p.amenities.length > 3) chips.push('+' + (p.amenities.length - 3) + ' more');
        return { num: i + 1, name: p.name, addressText: p.address || 'Address not listed', chips: chips };
      })
    };
  }
}
</script>
</body>
</html>
